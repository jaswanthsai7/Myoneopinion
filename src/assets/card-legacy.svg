<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="appleLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfbfd"/>
      <stop offset="100%" stop-color="#f2f2f7"/>
    </linearGradient>
    <linearGradient id="appleGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafc"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#appleLightBg)"/>
  <!-- Ambient soft cool lighting -->
  <circle cx="400" cy="200" r="280" fill="#e2e8f0" opacity="0.6" filter="blur(60px)"/>
  
  <!-- Apple Surface Card -->
  <rect x="70" y="60" width="660" height="380" rx="28" fill="url(#appleGlass)" stroke="rgba(0,0,0,0.06)" stroke-width="1.5" filter="url(#softShadow)"/>
  
  <!-- Top metadata row -->
  <g transform="translate(110, 108)">
    <rect width="138" height="28" rx="14" fill="#f4f4f6" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    <circle cx="16" cy="14" r="3.5" fill="#10b981"/>
    <text x="28" y="18" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="0.4">PERMANENT LINK</text>
    <text x="500" y="18" text-anchor="end" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">One URL · Timeless Artifact</text>
  </g>
  
  <!-- Apple Pass Card in Center -->
  <g transform="translate(110, 160)">
    <rect width="580" height="156" rx="20" fill="#f9f9fb" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>
    
    <g transform="translate(32, 34)">
      <text x="0" y="16" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8">CANONICAL IDENTIFIER</text>
      <text x="0" y="52" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', monospace" font-size="24" font-weight="600" letter-spacing="-0.5">myoneopinion.com/@you</text>
      <g transform="translate(0, 72)">
        <circle cx="5" cy="5" r="4" fill="#10b981"/>
        <text x="16" y="9" fill="#059669" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">Reserved for Early Access Member</text>
      </g>
    </g>
    
    <!-- Minimalist QR / Pass Badge -->
    <g transform="translate(460, 32)">
      <rect width="92" height="92" rx="16" fill="#ffffff" stroke="rgba(0,0,0,0.07)" stroke-width="1"/>
      <rect x="18" y="18" width="22" height="22" rx="4" fill="#1d1d1f"/>
      <rect x="52" y="18" width="22" height="22" rx="4" fill="#10b981"/>
      <rect x="18" y="52" width="22" height="22" rx="4" fill="#e2e8f0"/>
      <circle cx="63" cy="63" r="10" fill="#1d1d1f"/>
    </g>
  </g>
  
  <!-- Bottom info bar -->
  <g transform="translate(110, 350)">
    <rect width="180" height="34" rx="17" fill="#f4f4f6" stroke="rgba(0,0,0,0.06)"/>
    <text x="90" y="21" text-anchor="middle" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600">Claim Handle Preview</text>
    <text x="580" y="22" text-anchor="end" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">Exclusive to One-Opinion network</text>
  </g>
</svg>
