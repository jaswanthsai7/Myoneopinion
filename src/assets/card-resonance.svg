<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="appleResBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfbfd"/>
      <stop offset="100%" stop-color="#f3f3f8"/>
    </linearGradient>
    <linearGradient id="appleResGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafc"/>
    </linearGradient>
    <filter id="softShadowRes" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#appleResBg)"/>
  <circle cx="400" cy="220" r="280" fill="#fecdd3" opacity="0.35" filter="blur(70px)"/>
  
  <!-- Apple Surface Card -->
  <rect x="70" y="60" width="660" height="380" rx="28" fill="url(#appleResGlass)" stroke="rgba(0,0,0,0.06)" stroke-width="1.5" filter="url(#softShadowRes)"/>
  
  <g transform="translate(110, 105)">
    <rect width="130" height="28" rx="14" fill="#fff1f2" stroke="rgba(225,29,72,0.18)" stroke-width="1"/>
    <circle cx="16" cy="14" r="3.5" fill="#e11d48"/>
    <text x="28" y="18" fill="#e11d48" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="0.4">RESONANCE</text>
    <text x="500" y="18" text-anchor="end" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">Ranked by Connection</text>
  </g>
  
  <!-- Row 1: Top Ranked (Refined, no loud yellow!) -->
  <g transform="translate(110, 155)">
    <rect width="580" height="72" rx="18" fill="#f8f8fb" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <text x="24" y="44" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="700">#1</text>
    <text x="75" y="36" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="500">“Be curious, not judgmental.”</text>
    <text x="75" y="55" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">@ted · 2 days ago</text>
    
    <!-- Refined Apple Heart Pill -->
    <rect x="475" y="21" width="85" height="30" rx="15" fill="#fff1f2" stroke="rgba(225,29,72,0.2)"/>
    <text x="517.5" y="40" text-anchor="middle" fill="#e11d48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">♥ 1,429</text>
  </g>
  
  <!-- Row 2: Silver -->
  <g transform="translate(110, 240)">
    <rect width="580" height="72" rx="18" fill="#ffffff" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
    <text x="24" y="44" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="600">#2</text>
    <text x="75" y="36" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="500">“Simplicity is the ultimate sophistication.”</text>
    <text x="75" y="55" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">@leonardo · 5 days ago</text>
    
    <rect x="475" y="21" width="85" height="30" rx="15" fill="#f4f4f6" stroke="rgba(0,0,0,0.06)"/>
    <text x="517.5" y="40" text-anchor="middle" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">♥ 980</text>
  </g>
  
  <!-- Row 3: Bronze -->
  <g transform="translate(110, 325)">
    <rect width="580" height="72" rx="18" fill="#ffffff" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
    <text x="24" y="44" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="600">#3</text>
    <text x="75" y="36" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="500">“Stay hungry. Stay foolish.”</text>
    <text x="75" y="55" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">@steve · 1 week ago</text>
    
    <rect x="475" y="21" width="85" height="30" rx="15" fill="#f4f4f6" stroke="rgba(0,0,0,0.06)"/>
    <text x="517.5" y="40" text-anchor="middle" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">♥ 854</text>
  </g>
</svg>
