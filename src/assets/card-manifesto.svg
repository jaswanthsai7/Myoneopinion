<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <!-- Ambient subtle glow -->
  <circle cx="400" cy="250" r="280" fill="#d4af37" opacity="0.06" filter="blur(60px)"/>
  
  <!-- Apple-style Card Frame -->
  <rect x="70" y="60" width="660" height="380" rx="24" fill="url(#cardGlow)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- Top bar -->
  <g transform="translate(110, 110)">
    <rect width="110" height="28" rx="14" fill="rgba(212,175,55,0.12)" stroke="rgba(212,175,55,0.3)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#f5d77f"/>
    <text x="28" y="18" fill="#f5d77f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">MANIFESTO</text>
    <text x="500" y="18" text-anchor="end" fill="rgba(255,255,255,0.4)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="12">280 / 280 Characters</text>
  </g>
  
  <!-- Main Quote in Apple DM Serif style -->
  <text x="110" y="210" fill="#ffffff" font-family="Georgia, 'DM Serif Display', serif" font-size="34" font-weight="400" letter-spacing="-0.5">
    “Words that outlast the noise.
  </text>
  <text x="110" y="258" fill="#ffffff" font-family="Georgia, 'DM Serif Display', serif" font-size="34" font-weight="400" letter-spacing="-0.5">
    One opinion. Chosen carefully. Yours, forever.”
  </text>
  
  <!-- Author and metadata pill -->
  <g transform="translate(110, 340)">
    <circle cx="20" cy="20" r="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <text x="20" y="25" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">M</text>
    <text x="52" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="600">@marcus_aurelius</text>
    <text x="52" y="32" fill="rgba(255,255,255,0.4)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Permanent Immutable Entry · Signed</text>
  </g>
  
  <g transform="translate(610, 350)">
    <rect width="80" height="30" rx="15" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="40" y="19" text-anchor="middle" fill="#f5d77f" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">#001</text>
  </g>
</svg>
