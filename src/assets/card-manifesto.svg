<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="appleLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfbfd"/>
      <stop offset="100%" stop-color="#f2f2f7"/>
    </linearGradient>
    <linearGradient id="appleGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafc"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#appleLightBg)"/>
  <!-- Ambient soft cool lighting -->
  <circle cx="400" cy="200" r="280" fill="#e2e8f0" opacity="0.6" filter="blur(60px)"/>
  
  <!-- Apple Surface Card -->
  <rect x="70" y="60" width="660" height="380" rx="28" fill="url(#appleGlass)" stroke="rgba(0,0,0,0.06)" stroke-width="1.5" filter="url(#softShadow)"/>
  
  <!-- Top metadata row -->
  <g transform="translate(110, 108)">
    <rect width="118" height="28" rx="14" fill="#f4f4f6" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    <circle cx="16" cy="14" r="3.5" fill="#1d1d1f"/>
    <text x="28" y="18" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="0.4">MANIFESTO</text>
    <text x="500" y="18" text-anchor="end" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">280 Characters · Immutable</text>
  </g>
  
  <!-- Opinion Quote (Apple Editorial Focus) -->
  <text x="110" y="210" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'DM Sans', sans-serif" font-size="33" font-weight="600" letter-spacing="-0.8">
    “Words that outlast the noise.
  </text>
  <text x="110" y="258" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'DM Sans', sans-serif" font-size="33" font-weight="600" letter-spacing="-0.8">
    One opinion. Chosen carefully. Forever.”
  </text>
  
  <!-- Bottom info bar -->
  <g transform="translate(110, 340)">
    <circle cx="20" cy="20" r="20" fill="#f4f4f6" stroke="rgba(0,0,0,0.06)"/>
    <text x="20" y="25" text-anchor="middle" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">M</text>
    <text x="52" y="16" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="600">@marcus</text>
    <text x="52" y="32" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Permanent Canonical Record · Signed</text>
  </g>
  
  <g transform="translate(605, 348)">
    <rect width="85" height="30" rx="15" fill="#f4f4f6" stroke="rgba(0,0,0,0.06)"/>
    <text x="42.5" y="19" text-anchor="middle" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600">Entry #01</text>
  </g>
</svg>
