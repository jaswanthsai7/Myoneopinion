<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="voiceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#14141a"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="voicePanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#voiceBg)"/>
  <circle cx="400" cy="250" r="280" fill="#6366f1" opacity="0.08" filter="blur(80px)"/>
  
  <rect x="70" y="60" width="660" height="380" rx="24" fill="url(#voicePanel)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <g transform="translate(110, 105)">
    <rect width="130" height="28" rx="14" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#818cf8"/>
    <text x="28" y="18" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">HUMAN SANCTUARY</text>
    <text x="500" y="18" text-anchor="end" fill="rgba(255,255,255,0.4)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="12">Zero Algorithms · Zero Vanity</text>
  </g>
  
  <g transform="translate(110, 160)">
    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="600" letter-spacing="-0.5">
      No followers. No endless feed. No dopamine traps.
    </text>
    <text x="0" y="64" fill="rgba(255,255,255,0.5)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" line-height="24">
      Just one honest statement from every human being who chooses to speak.
    </text>
  </g>
  
  <!-- Comparison Cards -->
  <g transform="translate(110, 270)">
    <g transform="translate(0, 0)">
      <rect width="280" height="110" rx="16" fill="rgba(239,68,68,0.06)" stroke="rgba(239,68,68,0.2)"/>
      <text x="20" y="35" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">TRADITIONAL SOCIAL</text>
      <text x="20" y="62" fill="rgba(255,255,255,0.7)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">✕ Follower count anxiety</text>
      <text x="20" y="85" fill="rgba(255,255,255,0.7)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">✕ Algorithmic rage baiting</text>
    </g>
    
    <g transform="translate(300, 0)">
      <rect width="280" height="110" rx="16" fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)"/>
      <text x="20" y="35" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">MYONEOPINION</text>
      <text x="20" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">✓ Equal voice for every mind</text>
      <text x="20" y="85" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">✓ One timeless legacy link</text>
    </g>
  </g>
</svg>
