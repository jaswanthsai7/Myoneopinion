<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="appleVoiceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfbfd"/>
      <stop offset="100%" stop-color="#f3f3f8"/>
    </linearGradient>
    <linearGradient id="appleVoiceGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafafc"/>
    </linearGradient>
    <filter id="softShadowVoice" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="url(#appleVoiceBg)"/>
  <circle cx="400" cy="220" r="280" fill="#e0f2fe" opacity="0.45" filter="blur(75px)"/>
  
  <!-- Apple Surface Card -->
  <rect x="70" y="60" width="660" height="380" rx="28" fill="url(#appleVoiceGlass)" stroke="rgba(0,0,0,0.06)" stroke-width="1.5" filter="url(#softShadowVoice)"/>
  
  <g transform="translate(110, 105)">
    <rect width="135" height="28" rx="14" fill="#f0f9ff" stroke="rgba(14,165,233,0.18)" stroke-width="1"/>
    <circle cx="16" cy="14" r="3.5" fill="#0284c7"/>
    <text x="28" y="18" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="11" font-weight="600" letter-spacing="0.4">QUIET SANCTUARY</text>
    <text x="500" y="18" text-anchor="end" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12">Zero Algorithms · Zero Vanity</text>
  </g>
  
  <g transform="translate(110, 160)">
    <text x="0" y="32" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="600" letter-spacing="-0.5">
      No followers. No endless feed. No dopamine traps.
    </text>
    <text x="0" y="64" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" line-height="24">
      Just one honest statement from every human who chooses to speak.
    </text>
  </g>
  
  <!-- Comparison Cards in Apple Minimal Style -->
  <g transform="translate(110, 270)">
    <g transform="translate(0, 0)">
      <rect width="280" height="110" rx="18" fill="#f8f8fa" stroke="rgba(0,0,0,0.06)"/>
      <text x="22" y="35" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="0.4">TRADITIONAL FEEDS</text>
      <text x="22" y="63" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">✕ Follower count anxiety</text>
      <text x="22" y="87" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">✕ Algorithmic rage baiting</text>
    </g>
    
    <g transform="translate(300, 0)">
      <rect width="280" height="110" rx="18" fill="#ffffff" stroke="rgba(0,0,0,0.1)"/>
      <text x="22" y="35" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="0.4">MYONEOPINION</text>
      <text x="22" y="63" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">✓ Equal voice for every mind</text>
      <text x="22" y="87" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">✓ One timeless legacy link</text>
    </g>
  </g>
</svg>
